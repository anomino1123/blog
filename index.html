<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensamento Aberto | Onde a ideia encontra voz</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Barra de notificações -->
    <div id="notificationBadge" class="notification-badge" style="display: none;">
        <span id="notificationCount">0</span>
    </div>

    <div class="app-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon">💭</div>
                <div class="logo-text">
                    <h2>Pensamento<br>Aberto</h2>
                    <p>Onde a ideia encontra voz</p>
                </div>
            </div>

            <div class="user-info" id="userInfo">
                <div class="user-avatar" id="userAvatar" onclick="window.location.href='perfil.html'">
                    <span id="avatarEmoji">🧠</span>
                    <img id="avatarImage" style="display: none;">
                </div>
                <div class="user-details">
                    <h4 id="userName">Carregando...</h4>
                    <p id="userBio">Pensador crítico</p>
                </div>
            </div>

            <nav class="nav-menu">
                <button class="nav-btn active" data-page="feed">
                    <i class="fas fa-home"></i> <span>Início</span>
                </button>
                <button class="nav-btn" data-page="teses">
                    <i class="fas fa-brain"></i> <span>Minhas Teses</span>
                </button>
                <button class="nav-btn" data-page="diario">
                    <i class="fas fa-book"></i> <span>Diário</span>
                </button>
                <button class="nav-btn" data-page="jornal">
                    <i class="fas fa-newspaper"></i> <span>Notícias</span>
                </button>
                <button class="nav-btn" data-page="audio">
                    <i class="fas fa-microphone"></i> <span>Áudios</span>
                </button>
                <button class="nav-btn" data-page="meu-perfil" id="perfilBtn">
                    <i class="fas fa-user-circle"></i> <span>Meu Perfil</span>
                </button>
                <button class="nav-btn logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
                </button>
            </nav>
        </aside>

        <!-- Conteúdo principal -->
        <main class="main-content">
            <div class="top-bar">
                <h1 id="pageTitle">Início</h1>
                <div class="top-actions">
                    <button class="icon-btn" id="refreshFeedBtn">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="icon-btn" id="darkModeBtn">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>

            <div id="feedContainer" class="feed-container">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i> Carregando...
                </div>
            </div>
        </main>

        <!-- Sidebar direita -->
        <aside class="right-sidebar">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-comment-dots"></i>
                    <h3>Mensagens</h3>
                    <button class="small-btn" id="newChatBtn">+</button>
                </div>
                <div id="dmList" class="dm-list">
                    <p class="placeholder">Nenhuma conversa</p>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <i class="fas fa-user-plus"></i>
                    <h3>Descobrir pessoas</h3>
                </div>
                <div id="suggestionsList" class="suggestions-list">
                    <p class="placeholder">Carregando...</p>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <i class="fas fa-bell"></i>
                    <h3>Últimas notificações</h3>
                </div>
                <div id="notificationsList" class="notifications-list">
                    <p class="placeholder">Sem notificações</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Modal de postagem -->
    <div id="postModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>O que você está pensando?</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="post-type-selector">
                <button class="type-btn active" data-type="pensamento">💭 Pensamento</button>
                <button class="type-btn" data-type="tese">📚 Tese</button>
                <button class="type-btn" data-type="diario">📓 Diário</button>
                <button class="type-btn" data-type="jornal">📰 Notícia</button>
                <button class="type-btn" data-type="audio">🎙️ Áudio</button>
            </div>
            <input type="text" id="postTitleInput" placeholder="Título" class="post-input">
            <textarea id="postContentInput" placeholder="Escreva aqui..." class="post-textarea"></textarea>
            <input type="text" id="postEmojiInput" placeholder="Emoji (ex: 🔥, 💡, 📌)" class="post-input">
            
            <div id="audioRecordArea" class="audio-record-area" style="display: none;">
                <button id="startRecordingBtn" class="record-btn"><i class="fas fa-microphone"></i> Gravar áudio</button>
                <button id="stopRecordingBtn" class="stop-btn" style="display: none;"><i class="fas fa-stop"></i> Parar</button>
                <div id="audioPreviewArea"></div>
                <input type="hidden" id="audioDataField">
            </div>
            
            <button id="publishPostBtn" class="publish-btn">Publicar</button>
        </div>
    </div>

    <!-- Modal de DM -->
    <div id="dmModal" class="modal dm-modal">
        <div class="modal-content small">
            <div class="modal-header">
                <h3 id="dmTargetName">Conversa</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div id="dmMessagesArea" class="dm-messages"></div>
            <div class="dm-input-area">
                <input type="text" id="dmMessageInput" placeholder="Digite sua mensagem...">
                <button id="sendDmBtn" class="send-btn">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Botão flutuante de postagem -->
    <button id="fabPostBtn" class="fab-button">
        <i class="fas fa-plus"></i>
    </button>

    <script src="database.js"></script>
    <script src="notifications.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
